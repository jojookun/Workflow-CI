name: Retrain and publish Bank Marketing

on:
  push:
    branches: [main]
    paths: ['MLProject/**', 'verify_serving.py', '.github/workflows/retrain.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retraining-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/bank-marketing-msml
      IMAGE_TAG: run-${{ github.run_id }}-${{ github.run_attempt }}
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.7'
          cache: pip
          cache-dependency-path: MLProject/requirements.txt
      - name: Install training dependencies
        run: |
          python -m pip install -r MLProject/requirements.txt
          python -m pip check
      - name: Retrain with MLflow Project
        run: mlflow run MLProject --env-manager local --experiment-name Bank-Marketing-CI
      - name: Build image using MLflow
        run: mlflow models build-docker -m MLProject/outputs/model -n bank-marketing-ci --env-manager local
      - name: Verify container predictions
        run: |
          docker run -d --name bank-marketing-test -p 127.0.0.1:5001:8080 bank-marketing-ci
          python verify_serving.py
      - name: Save container logs
        if: always()
        run: |
          docker logs bank-marketing-test > container.log 2>&1 || true
          docker rm -f bank-marketing-test >/dev/null 2>&1 || true
      - name: Save model and verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bank-marketing-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            MLProject/outputs/
            container.log
          if-no-files-found: error
          retention-days: 90
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish verified Docker image
        run: |
          docker tag bank-marketing-ci "$IMAGE:$IMAGE_TAG"
          docker tag bank-marketing-ci "$IMAGE:latest"
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"
          docker inspect --format='{{json .RepoDigests}}' "$IMAGE:$IMAGE_TAG" > MLProject/outputs/image_digest.json
      - name: Store model in repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf bank-marketing-model.tar.gz -C MLProject/outputs .
          gh release create "$IMAGE_TAG" bank-marketing-model.tar.gz --target "$GITHUB_SHA" --title "Bank Marketing $IMAGE_TAG" --notes "Model hasil MLflow Project; image Docker sudah diuji. Image: $IMAGE:$IMAGE_TAG"
          echo "### Retraining dan publikasi berhasil" >> "$GITHUB_STEP_SUMMARY"
          echo "Docker image: $IMAGE:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
